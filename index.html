<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Object Viewer</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            overflow-x: hidden;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 100;
        }
        
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #666;
        }
        
        .logo {
            font-weight: bold;
            font-size: 24px;
            color: #222;
        }
        
        main {
            padding: 40px;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 24px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .viewer-container {
            width: 100%;
            height: 60vh;
            margin: 0 auto;
            background-color: #f8f8f8;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        #threejs-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 120px;
        }
        
        button:hover {
            background-color: #555;
            transform: translateY(-2px);
        }
        
        button.active {
            background-color: #0066ff;
        }
        
        .loading-bar {
            width: 100%;
            height: 4px;
            background-color: #eee;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 10;
        }
        
        .loading-progress {
            height: 100%;
            background-color: #0066ff;
            width: 0%;
            transition: width 0.3s;
        }
        
        .model-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 4px;
            display: none;
        }
        
        .upload-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .upload-btn {
            position: relative;
            overflow: hidden;
        }
        
        .upload-btn input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .url-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .url-input input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
            max-width: 100%;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }
            
            .subtitle {
                font-size: 18px;
            }
            
            .controls, .upload-container {
                flex-direction: column;
                align-items: center;
            }
            
            button, .url-input {
                width: 100%;
                max-width: 200px;
            }
            
            .url-input input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">3DView</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    
    <main>
        <h1>3D</h1>
        <div class="subtitle">object viewer</div>
        
        <div class="upload-container">
            <button class="upload-btn">
                Upload Model
                <input type="file" id="file-upload" accept=".glb,.gltf,.fbx,.obj">
            </button>
            
            <div class="url-input">
                <input type="text" id="model-url" placeholder="Enter model URL">
                <button id="load-url-btn">Load URL</button>
            </div>
        </div>
        
        <div class="viewer-container">
            <canvas id="threejs-canvas"></canvas>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-bar"></div>
            </div>
        </div>
        
        <div class="controls">
            <button id="rotate-btn">Rotate</button>
            <button id="zoom-fit">Zoom Fit</button>
            <button id="details-btn">Details</button>
            <button id="reset-btn">Reset</button>
        </div>
        
        <div class="model-info" id="model-info">
            <h3>Model Information</h3>
            <p id="model-stats">No model loaded</p>
        </div>
    </main>

    <!-- Three.js and related libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/DRACOLoader.js"></script>
    
    <script>
        // Main Three.js implementation
        document.addEventListener('DOMContentLoaded', () => {
            // Scene setup
            const container = document.getElementById('threejs-canvas');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8f8f8);
            
            // Camera
            const camera = new THREE.PerspectiveCamera(
                75, 
                window.innerWidth / window.innerHeight, 
                0.1, 
                1000
            );
            camera.position.z = 5;
            
            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: container });

                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(container.clientWidth, container.clientHeight);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            // Add a grid helper
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);
            
            // Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.maxPolarAngle = Math.PI;
            controls.minDistance = 0.5;
            controls.maxDistance = 20;
            
            // Model variables
            let model = null;
            let boundingBox = null;
            let autoRotate = false;
            
            // Loader setup
            const loadingManager = new THREE.LoadingManager();
            const gltfLoader = new THREE.GLTFLoader(loadingManager);
            const objLoader = new THREE.OBJLoader(loadingManager);
            const fbxLoader = new THREE.FBXLoader(loadingManager);
            
            // Initialize DRACO loader for GLTF compression
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            gltfLoader.setDRACOLoader(dracoLoader);
            
            // Loading progress
            loadingManager.onProgress = (url, itemsLoaded, itemsTotal) => {
                const progress = (itemsLoaded / itemsTotal) * 100;
                document.getElementById('loading-bar').style.width = `${progress}%`;
            };
            
            // Load model from URL
            function loadModelFromUrl(url) {
                document.getElementById('loading-bar').style.width = '0%';
                document.getElementById('loading-bar').style.opacity = '1';
                document.getElementById('model-stats').textContent = 'Loading model...';
                
                const extension = url.split('.').pop().toLowerCase();
                
                try {
                    if (extension === 'gltf' || extension === 'glb') {
                        gltfLoader.load(
                            url,
                            (gltf) => handleLoadedModel(gltf.scene, 'glTF'),
                            undefined,
                            (error) => handleLoadError(error)
                        );
                    } else if (extension === 'obj') {
                        objLoader.load(
                            url,
                            (object) => handleLoadedModel(object, 'OBJ'),
                            undefined,
                            (error) => handleLoadError(error)
                        );
                    } else if (extension === 'fbx') {
                        fbxLoader.load(
                            url,
                            (object) => handleLoadedModel(object, 'FBX'),
                            undefined,
                            (error) => handleLoadError(error)
                        );
                    } else {
                        throw new Error('Unsupported file format');
                    }
                } catch (error) {
                    handleLoadError(error);
                }
            }
            
            // Handle file upload
            document.getElementById('file-upload').addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                document.getElementById('loading-bar').style.width = '0%';
                document.getElementById('loading-bar').style.opacity = '1';
                document.getElementById('model-stats').textContent = 'Loading model...';
                
                const reader = new FileReader();
                const extension = file.name.split('.').pop().toLowerCase();
                
                reader.onload = function(e) {
                    try {
                        if (extension === 'gltf' || extension === 'glb') {
                            gltfLoader.parse(
                                e.target.result,
                                '',
                                (gltf) => handleLoadedModel(gltf.scene, 'glTF'),
                                (error) => handleLoadError(error)
                            );
                        } else if (extension === 'obj') {
                            const contents = e.target.result;
                            objLoader.parse(
                                contents,
                                (object) => handleLoadedModel(object, 'OBJ'),
                                (error) => handleLoadError(error)
                            );
                        } else if (extension === 'fbx') {
                            const contents = e.target.result;
                            fbxLoader.parse(
                                contents,
                                '',
                                (object) => handleLoadedModel(object, 'FBX'),
                                (error) => handleLoadError(error)
                            );
                        } else {
                            throw new Error('Unsupported file format');
                        }
                    } catch (error) {
                        handleLoadError(error);
                    }
                };
                
                if (extension === 'gltf') {
                    reader.readAsText(file);
                } else {
                    reader.readAsArrayBuffer(file);
                }
            });
            
            // Handle URL loading
            document.getElementById('load-url-btn').addEventListener('click', () => {
                const url = document.getElementById('model-url').value.trim();
                if (url) {
                    loadModelFromUrl(url);
                } else {
                    alert('Please enter a valid URL');
                }
            });
            
            // Handle model after loading
            function handleLoadedModel(loadedModel, format) {
                if (model) scene.remove(model);
                
                model = loadedModel;
                scene.add(model);
                
                // Calculate bounding box
                boundingBox = new THREE.Box3().setFromObject(model);
                const center = boundingBox.getCenter(new THREE.Vector3());
                const size = boundingBox.getSize(new THREE.Vector3());
                
                // Center model
                model.position.sub(center);
                
                // Scale to fit view
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 3 / maxDim;
                model.scale.set(scale, scale, scale);
                
                // Update model info
                updateModelInfo(model, format);
                
                // Zoom to fit
                zoomToFit();
                
                // Hide loading bar
                setTimeout(() => {
                    document.getElementById('loading-bar').style.opacity = '0';
                }, 500);
            }
            
            // Handle load errors
            function handleLoadError(error) {
                console.error('Error loading model:', error);
                document.getElementById('model-stats').textContent = 
                    'Error loading model: ' + (error.message || 'Unknown error');
                document.getElementById('loading-bar').style.opacity = '0';
            }
            
            // Update model information panel
            function updateModelInfo(model, format) {
                const info = document.getElementById('model-info');
                const stats = document.getElementById('model-stats');
                
                if (!model) {
                    stats.textContent = 'No model loaded';
                    return;
                }
                
                let triangleCount = 0;
                let materialCount = 0;
                let textureCount = 0;
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        if (child.geometry) {
                            if (child.geometry.index) {
                                triangleCount += child.geometry.index.count / 3;
                            } else if (child.geometry.attributes.position) {
                                triangleCount += child.geometry.attributes.position.count / 3;
                            }
                        }
                        if (child.material) {
                            materialCount++;
                            if (child.material.map) textureCount++;
                        }
                    }
                });
                
                boundingBox = boundingBox || new THREE.Box3().setFromObject(model);
                const size = boundingBox.getSize(new THREE.Vector3());
                
                stats.innerHTML = `
                    <strong>Format:</strong> ${format}<br>
                    <strong>Dimensions:</strong> ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}<br>
                    <strong>Triangles:</strong> ${triangleCount.toLocaleString()}<br>
                    <strong>Materials:</strong> ${materialCount}<br>
                    <strong>Textures:</strong> ${textureCount}
                `;
                
                info.style.display = 'block';
            }
            
            // Zoom to fit model
            function zoomToFit() {
                if (!model || !boundingBox) return;
                
                const size = boundingBox.getSize(new THREE.Vector3());
                const center = boundingBox.getCenter(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                
                // Add some padding
                cameraZ *= 1.2;
                
                camera.position.copy(center);
                camera.position.z += cameraZ;
                
                controls.target.copy(center);
                controls.update();
            }
            
            // Reset view
            function resetView() {
                zoomToFit();
                controls.reset();
                autoRotate = false;
                controls.autoRotate = false;
                document.getElementById('rotate-btn').classList.remove('active');
            }
            
            // Event listeners for buttons
            document.getElementById('rotate-btn').addEventListener('click', () => {
                autoRotate = !autoRotate;
                controls.autoRotate = autoRotate;
                document.getElementById('rotate-btn').classList.toggle('active');
            });
            
            document.getElementById('zoom-fit').addEventListener('click', zoomToFit);
            
            document.getElementById('details-btn').addEventListener('click', () => {
                const info = document.getElementById('model-info');
                info.style.display = info.style.display === 'none' ? 'block' : 'none';
            });
            
            document.getElementById('reset-btn').addEventListener('click', resetView);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            
            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = 
                    document.querySelector('.viewer-container').clientWidth / 
                    document.querySelector('.viewer-container').clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(
                    document.querySelector('.viewer-container').clientWidth,
                    document.querySelector('.viewer-container').clientHeight
                );
            });
            
            // Load default model (optional)
            // loadModelFromUrl('https://example.com/path/to/default-model.glb');
        });
    </script>
</body>
</html>
